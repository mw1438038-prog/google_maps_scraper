<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Maps Lead Finder</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <style>
      /* =====================================================
         CUSTOM DROPDOWN
      ===================================================== */

      .custom-select {
        position: relative;
        width: 100%;
      }

      .select-trigger {
        width: 100%;
        height: 46px;

        padding: 0 14px;

        border: 1px solid #d5dce0;
        border-radius: 10px;

        background: white;
        color: #17202a;

        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        align-items: center;
        justify-content: space-between;

        cursor: pointer;

        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .select-trigger:hover {
        border-color: #1f6f50;
      }

      .custom-select.open .select-trigger {
        border-color: #1f6f50;

        box-shadow: 0 0 0 3px rgba(31, 111, 80, 0.1);
      }

      .select-arrow {
        font-size: 12px;

        transition: transform 0.2s ease;
      }

      .custom-select.open .select-arrow {
        transform: rotate(180deg);
      }

      .select-trigger.disabled {
        background: #f1f4f3;

        color: #8a969d;

        cursor: not-allowed;
      }

      /* =====================================================
         DROPDOWN MENU
      ===================================================== */

      .select-menu {
        position: absolute;

        top: calc(100% + 6px);

        left: 0;

        width: 100%;

        max-height: 280px;

        overflow-y: auto;

        background: white;

        border: 1px solid #d5dce0;

        border-radius: 10px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);

        z-index: 1000;

        display: none;
      }

      .custom-select.open .select-menu {
        display: block;
      }

      /* =====================================================
         DROPDOWN SEARCH
      ===================================================== */

      .dropdown-search {
        position: sticky;

        top: 0;

        padding: 10px;

        background: white;

        border-bottom: 1px solid #e8edef;

        z-index: 2;
      }

      .dropdown-search input {
        width: 100%;

        height: 38px;

        padding: 0 10px;

        border: 1px solid #d5dce0;

        border-radius: 8px;

        outline: none;

        font-size: 14px;
      }

      .dropdown-search input:focus {
        border-color: #1f6f50;

        box-shadow: 0 0 0 2px rgba(31, 111, 80, 0.08);
      }

      /* =====================================================
         DROPDOWN OPTIONS
      ===================================================== */

      .select-options {
        padding: 5px;
      }

      .select-option {
        padding: 10px 11px;

        border-radius: 7px;

        font-size: 14px;

        color: #17202a;

        cursor: pointer;
      }

      .select-option:hover {
        background: #eef5f1;

        color: #1f6f50;
      }

      .select-option.selected {
        background: #e7f6ed;

        color: #1f6f50;

        font-weight: 600;
      }

      .select-option.disabled {
        color: #8a969d;

        cursor: not-allowed;

        background: transparent;
      }

      /* =====================================================
         DROPDOWN SCROLLBAR
      ===================================================== */

      .select-menu::-webkit-scrollbar {
        width: 7px;
      }

      .select-menu::-webkit-scrollbar-track {
        background: #f1f3f4;
      }

      .select-menu::-webkit-scrollbar-thumb {
        background: #b8c2c7;

        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =====================================================
           HEADER
      ====================================================== -->

      <header class="hero">
        <h1>Google Maps Lead Finder</h1>

        <p>Find businesses by country, city and keyword</p>
      </header>

      <!-- =====================================================
           SEARCH
      ====================================================== -->

      <section class="search-card">
        <!-- =================================================
             COUNTRY
        ================================================= -->

        <div class="form-group">
          <label> Country </label>

          <div class="custom-select" id="countryDropdown">
            <button type="button" class="select-trigger" id="countryTrigger">
              <span id="countryText"> Loading countries... </span>

              <span class="select-arrow"> ▼ </span>
            </button>

            <div class="select-menu">
              <div class="dropdown-search">
                <input
                  type="text"
                  id="countrySearch"
                  placeholder="Search country..."
                  autocomplete="off"
                />
              </div>

              <div class="select-options" id="countryOptions"></div>
            </div>
          </div>
        </div>

        <!-- =================================================
             CITY
        ================================================= -->

        <div class="form-group">
          <label> City </label>

          <div class="custom-select" id="cityDropdown">
            <button
              type="button"
              class="select-trigger disabled"
              id="cityTrigger"
              disabled
            >
              <span id="cityText"> Select country first </span>

              <span class="select-arrow"> ▼ </span>
            </button>

            <div class="select-menu">
              <div class="dropdown-search">
                <input
                  type="text"
                  id="citySearch"
                  placeholder="Search city..."
                  autocomplete="off"
                />
              </div>

              <div class="select-options" id="cityOptions"></div>
            </div>
          </div>
        </div>

        <!-- =================================================
             KEYWORD
        ================================================= -->

        <div class="form-group">
          <label for="keyword"> Keyword </label>

          <input
            type="text"
            id="keyword"
            placeholder="e.g. coaching"
            autocomplete="off"
          />
        </div>

        <!-- =================================================
             SEARCH BUTTON
        ================================================= -->

        <button id="searchButton" onclick="searchPlaces()">
          🔍 Search Google Maps
        </button>
      </section>

      <!-- =====================================================
           STATUS
      ====================================================== -->

      <section id="status" class="status"></section>

      <!-- =====================================================
           RESULTS
      ====================================================== -->

      <section class="results-section">
        <div class="results-header">
          <div class="results-title">
            <h2>Search Results</h2>

            <span id="resultCount"> 0 results </span>
          </div>

          <!-- =================================================
               EXPORT
          ================================================= -->

          <div class="export-buttons">
            <button
              id="csvButton"
              class="export-button"
              onclick="exportCSV()"
              disabled
            >
              📥 Export CSV
            </button>

            <button
              id="excelButton"
              class="export-button excel-button"
              onclick="exportExcel()"
              disabled
            >
              📊 Export Excel
            </button>
          </div>
        </div>

        <!-- =================================================
             TABLE
        ================================================= -->

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>

                <th>Business</th>

                <th>Phone</th>

                <th>Website</th>

                <th>Location</th>

                <th>Rating</th>

                <th>Reviews</th>

                <th>Google Maps</th>
              </tr>
            </thead>

            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      // =========================================================
      // GLOBAL DATA
      // =========================================================

      let currentResults = [];

      let countries = [];

      let cities = [];

      let selectedCountry = "";

      let selectedCity = "";

      // =========================================================
      // ELEMENTS
      // =========================================================

      const countryDropdown = document.getElementById("countryDropdown");

      const cityDropdown = document.getElementById("cityDropdown");

      const countryTrigger = document.getElementById("countryTrigger");

      const cityTrigger = document.getElementById("cityTrigger");

      const countryText = document.getElementById("countryText");

      const cityText = document.getElementById("cityText");

      const countryOptions = document.getElementById("countryOptions");

      const cityOptions = document.getElementById("cityOptions");

      const countrySearch = document.getElementById("countrySearch");

      const citySearch = document.getElementById("citySearch");

      // =========================================================
      // CLOSE ALL DROPDOWNS
      // =========================================================

      function closeDropdowns() {
        countryDropdown.classList.remove("open");

        cityDropdown.classList.remove("open");
      }

      // =========================================================
      // COUNTRY DROPDOWN
      // =========================================================

      countryTrigger.addEventListener("click", function () {
        if (countryTrigger.disabled) {
          return;
        }

        const isOpen = countryDropdown.classList.contains("open");

        closeDropdowns();

        if (!isOpen) {
          countryDropdown.classList.add("open");

          countrySearch.value = "";

          renderCountries();

          setTimeout(function () {
            countrySearch.focus();
          }, 50);
        }
      });

      // =========================================================
      // CITY DROPDOWN
      // =========================================================

      cityTrigger.addEventListener("click", function () {
        if (cityTrigger.disabled) {
          return;
        }

        const isOpen = cityDropdown.classList.contains("open");

        closeDropdowns();

        if (!isOpen) {
          cityDropdown.classList.add("open");

          citySearch.value = "";

          renderCities();

          setTimeout(function () {
            citySearch.focus();
          }, 50);
        }
      });

      // =========================================================
      // CLICK OUTSIDE
      // =========================================================

      document.addEventListener("click", function (event) {
        if (
          !countryDropdown.contains(event.target) &&
          !cityDropdown.contains(event.target)
        ) {
          closeDropdowns();
        }
      });

      // =========================================================
      // RENDER COUNTRIES
      // =========================================================

      function renderCountries(searchValue = "") {
        countryOptions.innerHTML = "";

        const search = searchValue.toLowerCase().trim();

        const filtered = countries.filter(function (country) {
          return country.toLowerCase().includes(search);
        });

        if (!filtered.length) {
          const empty = document.createElement("div");

          empty.className = "select-option disabled";

          empty.textContent = "No countries found.";

          countryOptions.appendChild(empty);

          return;
        }

        filtered.forEach(function (country) {
          const option = document.createElement("div");

          option.className = "select-option";

          if (country === selectedCountry) {
            option.classList.add("selected");
          }

          option.textContent = country;

          option.addEventListener("click", function () {
            selectCountry(country);
          });

          countryOptions.appendChild(option);
        });
      }

      // =========================================================
      // SELECT COUNTRY
      // =========================================================

      function selectCountry(country) {
        selectedCountry = country;

        selectedCity = "";

        countryText.textContent = country;

        cityText.textContent = "Loading cities...";

        cityTrigger.disabled = true;

        cityTrigger.classList.add("disabled");

        closeDropdowns();

        cities = [];

        cityOptions.innerHTML = "";

        loadCities();
      }

      // =========================================================
      // COUNTRY SEARCH
      // =========================================================

      countrySearch.addEventListener("input", function () {
        renderCountries(countrySearch.value);
      });

      // =========================================================
      // LOAD COUNTRIES
      // =========================================================

      async function loadCountries() {
        const status = document.getElementById("status");

        try {
          const response = await fetch("/api/countries");

          const contentType = response.headers.get("content-type") || "";

          if (!response.ok) {
            const text = await response.text();

            throw new Error(
              `Countries API failed (${response.status}): ${text.substring(0, 200)}`,
            );
          }

          if (!contentType.includes("application/json")) {
            const text = await response.text();

            throw new Error(
              `Countries API returned non-JSON response: ${text.substring(0, 200)}`,
            );
          }

          const data = await response.json();

          if (!data.success) {
            throw new Error(data.message || "Could not load countries.");
          }

          countries = Array.isArray(data.countries) ? data.countries : [];

          countryText.textContent = "Select Country";

          renderCountries();
        } catch (error) {
          console.error("Countries Error:", error);

          countryText.textContent = "Could not load countries";

          status.className = "status error";

          status.textContent = error.message;
        }
      }

      // =========================================================
      // RENDER CITIES
      // =========================================================

      function renderCities(searchValue = "") {
        cityOptions.innerHTML = "";

        const search = searchValue.toLowerCase().trim();

        const filtered = cities.filter(function (city) {
          return city.toLowerCase().includes(search);
        });

        if (!filtered.length) {
          const empty = document.createElement("div");

          empty.className = "select-option disabled";

          empty.textContent = "No cities found.";

          cityOptions.appendChild(empty);

          return;
        }

        filtered.forEach(function (city) {
          const option = document.createElement("div");

          option.className = "select-option";

          if (city === selectedCity) {
            option.classList.add("selected");
          }

          option.textContent = city;

          option.addEventListener("click", function () {
            selectCity(city);
          });

          cityOptions.appendChild(option);
        });
      }

      // =========================================================
      // SELECT CITY
      // =========================================================

      function selectCity(city) {
        selectedCity = city;

        cityText.textContent = city;

        closeDropdowns();
      }

      // =========================================================
      // CITY SEARCH
      // =========================================================

      citySearch.addEventListener("input", function () {
        renderCities(citySearch.value);
      });

      // =========================================================
      // LOAD CITIES
      // =========================================================

      async function loadCities() {
        const status = document.getElementById("status");

        if (!selectedCountry) {
          cityText.textContent = "Select country first";

          cityTrigger.disabled = true;

          cityTrigger.classList.add("disabled");

          return;
        }

        status.className = "status loading";

        status.textContent = `Loading cities of ${selectedCountry}...`;

        try {
          const response = await fetch("/api/cities", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              country: selectedCountry,
            }),
          });

          const contentType = response.headers.get("content-type") || "";

          if (!response.ok) {
            const text = await response.text();

            throw new Error(
              `Cities API failed (${response.status}): ${text.substring(0, 200)}`,
            );
          }

          if (!contentType.includes("application/json")) {
            const text = await response.text();

            throw new Error(
              `Cities API returned non-JSON response: ${text.substring(0, 200)}`,
            );
          }

          const data = await response.json();

          if (!data.success) {
            throw new Error(data.message || "Could not load cities.");
          }

          cities = Array.isArray(data.cities) ? data.cities : [];

          cityText.textContent = "Select City";

          renderCities();

          if (cities.length > 0) {
            cityTrigger.disabled = false;

            cityTrigger.classList.remove("disabled");

            status.className = "status success";

            status.textContent = `${cities.length} cities loaded for ${selectedCountry}.`;
          } else {
            cityTrigger.disabled = true;

            cityTrigger.classList.add("disabled");

            status.className = "status error";

            status.textContent = `No cities found for ${selectedCountry}.`;
          }
        } catch (error) {
          console.error("Cities Error:", error);

          cities = [];

          cityText.textContent = "Could not load cities";

          cityTrigger.disabled = true;

          cityTrigger.classList.add("disabled");

          status.className = "status error";

          status.textContent = error.message;
        }
      }

      // =========================================================
      // SEARCH PLACES
      // =========================================================

      async function searchPlaces() {
        const country = selectedCountry;

        const city = selectedCity;

        const keyword = document.getElementById("keyword").value.trim();

        const button = document.getElementById("searchButton");

        const status = document.getElementById("status");

        const resultsBody = document.getElementById("resultsBody");

        const resultCount = document.getElementById("resultCount");

        const csvButton = document.getElementById("csvButton");

        const excelButton = document.getElementById("excelButton");

        // =====================================================
        // VALIDATION
        // =====================================================

        if (!country) {
          status.className = "status error";

          status.textContent = "Please select a country.";

          return;
        }

        if (!city) {
          status.className = "status error";

          status.textContent = "Please select a city.";

          return;
        }

        if (!keyword) {
          status.className = "status error";

          status.textContent = "Please enter a keyword.";

          return;
        }

        // =====================================================
        // RESET
        // =====================================================

        currentResults = [];

        csvButton.disabled = true;

        excelButton.disabled = true;

        button.disabled = true;

        button.textContent = "Searching...";

        status.className = "status loading";

        status.textContent = "Searching Google Maps...";

        resultsBody.innerHTML = "";

        resultCount.textContent = "0 results";

        try {
          const response = await fetch("/api/search", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              country: country,

              city: city,

              keyword: keyword,
            }),
          });

          const contentType = response.headers.get("content-type") || "";

          if (!response.ok) {
            if (contentType.includes("application/json")) {
              const error = await response.json();

              throw new Error(error.message || "Search failed.");
            }

            const text = await response.text();

            throw new Error(
              `Search failed (${response.status}): ${text.substring(0, 200)}`,
            );
          }

          if (!contentType.includes("application/json")) {
            const text = await response.text();

            throw new Error(
              `Server returned non-JSON response: ${text.substring(0, 200)}`,
            );
          }

          const data = await response.json();

          if (!data.success) {
            throw new Error(data.message || "Search failed.");
          }

          // ===================================================
          // SAVE RESULTS
          // ===================================================

          currentResults = Array.isArray(data.results) ? data.results : [];

          // ===================================================
          // DISPLAY
          // ===================================================

          displayResults(currentResults);

          resultCount.textContent = `${currentResults.length} results`;

          // ===================================================
          // ENABLE EXPORT
          // ===================================================

          if (currentResults.length > 0) {
            csvButton.disabled = false;

            excelButton.disabled = false;
          }

          status.className = "status success";

          status.textContent = `Found ${currentResults.length} businesses.`;
        } catch (error) {
          console.error("Search Error:", error);

          status.className = "status error";

          status.textContent = error.message || "Search failed.";
        } finally {
          button.disabled = false;

          button.textContent = "🔍 Search Google Maps";
        }
      }

      // =========================================================
      // DISPLAY RESULTS
      // =========================================================

      function displayResults(results) {
        const resultsBody = document.getElementById("resultsBody");

        resultsBody.innerHTML = "";

        if (!results.length) {
          resultsBody.innerHTML = `

            <tr>

              <td
                colspan="8"
                class="no-results"
              >
                No businesses found.
              </td>

            </tr>

          `;

          return;
        }

        results.forEach(function (place, index) {
          const row = document.createElement("tr");

          const website = place.website
            ? `

                  <a
                    href="${escapeHtml(place.website)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Website
                  </a>

                `
            : "-";

          const maps = place.maps_url
            ? `

                  <a
                    href="${escapeHtml(place.maps_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    📍 Open Maps
                  </a>

                `
            : "-";

          row.innerHTML = `

              <td>
                ${index + 1}
              </td>

              <td>
                <strong>
                  ${escapeHtml(place.name)}
                </strong>
              </td>

              <td>
                ${escapeHtml(place.phone || "-")}
              </td>

              <td>
                ${website}
              </td>

              <td>
                ${escapeHtml(place.address || "-")}
              </td>

              <td>
                ⭐ ${place.rating || "-"}
              </td>

              <td>
                ${place.reviews || "-"}
              </td>

              <td>
                ${maps}
              </td>

            `;

          resultsBody.appendChild(row);
        });
      }

      // =========================================================
      // EXPORT CSV
      // =========================================================

      async function exportCSV() {
        if (!currentResults.length) {
          alert("No leads available to export.");

          return;
        }

        try {
          const response = await fetch("/api/export/csv", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              results: currentResults,
            }),
          });

          if (!response.ok) {
            const contentType = response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
              const error = await response.json();

              throw new Error(error.message || "CSV export failed.");
            }

            const text = await response.text();

            throw new Error(
              `CSV export failed (${response.status}): ${text.substring(0, 200)}`,
            );
          }

          const blob = await response.blob();

          downloadFile(blob, "google_maps_leads.csv");
        } catch (error) {
          console.error("CSV Export Error:", error);

          alert(error.message);
        }
      }

      // =========================================================
      // EXPORT EXCEL
      // =========================================================

      async function exportExcel() {
        if (!currentResults.length) {
          alert("No leads available to export.");

          return;
        }

        try {
          const response = await fetch("/api/export/excel", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              results: currentResults,
            }),
          });

          if (!response.ok) {
            const contentType = response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
              const error = await response.json();

              throw new Error(error.message || "Excel export failed.");
            }

            const text = await response.text();

            throw new Error(
              `Excel export failed (${response.status}): ${text.substring(0, 200)}`,
            );
          }

          const blob = await response.blob();

          downloadFile(blob, "google_maps_leads.xlsx");
        } catch (error) {
          console.error("Excel Export Error:", error);

          alert(error.message);
        }
      }

      // =========================================================
      // DOWNLOAD FILE
      // =========================================================

      function downloadFile(blob, filename) {
        const url = window.URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = filename;

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(function () {
          window.URL.revokeObjectURL(url);
        }, 100);
      }

      // =========================================================
      // ESCAPE HTML
      // =========================================================

      function escapeHtml(value) {
        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
      }

      // =========================================================
      // ENTER KEY
      // =========================================================

      document
        .getElementById("keyword")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            searchPlaces();
          }
        });

      // =========================================================
      // LOAD COUNTRIES
      // =========================================================

      document.addEventListener("DOMContentLoaded", function () {
        loadCountries();
      });
    </script>
  </body>
</html>
